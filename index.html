<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alan International School — Үйірмелер кестесі</title>
<meta name="description" content="ROLAB × Alan International School club schedule viewer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-field" aria-hidden="true">
  <span class="blob blob-a"></span>
  <span class="blob blob-b"></span>
  <span class="blob blob-c"></span>
</div>

<header class="site-header">
  <div class="header-inner">
    <a href="#" class="brand" id="brandHome">
      <span class="brand-marks">
        <img src="assets/alan-logo.png" alt="Alan International School" class="brand-logo brand-logo-alan">
        <span class="brand-x">×</span>
        <img src="assets/rolab-logo.png" alt="ROLAB" class="brand-logo brand-logo-rolab">
      </span>
      <span class="brand-word" id="siteTitle">Alan — ҮЙІРМЕЛЕР КЕСТЕСІ</span>
    </a>
    <nav class="lang-switch" id="langSwitch" aria-label="Language switch">
      <button type="button" data-lang="kz" class="lang-btn is-active">KZ</button>
      <button type="button" data-lang="ru" class="lang-btn">RU</button>
      <button type="button" data-lang="en" class="lang-btn">EN</button>
    </nav>
  </div>
</header>

<main id="app" class="app">

  <!-- ============ HOME VIEW ============ -->
  <section id="view-home" class="view view-home">
    <div class="home-lead">
      <p id="heroLead" class="hero-lead">Үйірмеңізді таңдап, күнін белгілеңіз — сол күнгі оқушылар тізімі бірден шығады.</p>
    </div>

    <div id="sectionsRoot"></div>
  </section>

  <!-- ============ FAMILY / GRADE PICKER VIEW ============ -->
  <section id="view-grades" class="view view-grades" hidden>
    <button type="button" class="back-btn" id="backToHomeFromGrades">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="backLabel3">Артқа</span>
    </button>

    <div class="club-heading">
      <div class="club-heading-logo-wrap" id="gradesHeadingLogoWrap">
        <img id="gradesHeadingLogo" class="club-heading-logo" alt="" hidden>
        <span id="gradesHeadingIcon" class="club-heading-icon"></span>
      </div>
      <div>
        <h1 id="gradesHeadingName" class="club-heading-name"></h1>
      </div>
    </div>

    <div class="club-grid" id="gradesGrid"></div>
  </section>

  <!-- ============ CLUB / DAY VIEW ============ -->
  <section id="view-club" class="view view-club" hidden>
    <button type="button" class="back-btn" id="backToHome">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="backLabel1">Артқа</span>
    </button>

    <div class="club-heading">
      <div class="club-heading-logo-wrap" id="clubHeadingLogoWrap">
        <img id="clubHeadingLogo" class="club-heading-logo" alt="" hidden>
        <span id="clubHeadingIcon" class="club-heading-icon"></span>
      </div>
      <div>
        <h1 id="clubHeadingName" class="club-heading-name">LEGO</h1>
        <p id="clubHeadingSub" class="club-heading-sub">2–4 сынып</p>
        <p id="clubHeadingTime" class="club-heading-time"></p>
      </div>
    </div>

    <div class="day-grid" id="dayGrid"></div>
  </section>

  <!-- ============ STUDENTS VIEW ============ -->
  <section id="view-students" class="view view-students" hidden>
    <button type="button" class="back-btn" id="backToClub">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="backLabel2">Артқа</span>
    </button>

    <div class="students-heading">
      <div>
        <p class="students-eyebrow" id="studentsClubLabel">LEGO · 2–4 сынып</p>
        <h1 id="dayHeading" class="students-day-heading">Дүйсенбі</h1>
      </div>
      <div class="students-count" id="studentsCount">Оқушылар саны: 0</div>
    </div>

    <div class="students-controls">
      <div class="search-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="search-icon"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Оқушыны іздеу...">
      </div>
      <select id="classFilter" class="class-filter"></select>
    </div>

    <div id="studentsBody" class="students-body"></div>
  </section>

</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="assets/alan-logo.png" alt="Alan International School" class="footer-logo">
      <img src="assets/rolab-logo.png" alt="ROLAB" class="footer-logo">
      <div>
        <div class="footer-name">ROLAB × ALAN</div>
        <div class="footer-tagline" id="footerTagline">Үйірмелер кестесі</div>
      </div>
    </div>
    <div class="footer-copy">© 2026 ROLAB × Alan International School</div>
  </div>
</footer>

<script src="data.js"></script>
<script src="translations.js"></script>
<script src="script.js"></script>
</body>
</html>
